[project]
name = "compliance-tooling"
version = "0.6.0"
description = "Self-hosted OPA-centered compliance tooling"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "rfc8785==0.1.4",
]

[project.scripts]
compliance = "tools.cli:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "tools"
module-root = ""
data = { purelib = "package-data" }
