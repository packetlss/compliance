name: Destination validation

on:
  pull_request:
    branches: [main, successor]
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - successor

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: validation-routing
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.route.outputs.target }}
      legacy: ${{ steps.route.outputs.legacy }}
      # Pre-Phase-A B has no experiment output and refuses every application path.
      experiment: ${{ steps.route.outputs.experiment || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit target and changed scope
        id: route
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == main ]]; then
            printf 'target=main\nlegacy=true\nexperiment=false\n' >> "$GITHUB_OUTPUT"
          elif [[ "$TARGET" == successor ]]; then
            if [[ -n "$PR_NUMBER" ]]; then
              git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/routing/head"
              [[ "$(git rev-parse refs/remotes/routing/head)" == "$HEAD_SHA" ]]
            fi
            if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then BASE="$HEAD_SHA"; fi
            # Checkout is trusted B for PRs; never load a classifier from proposed H.
            scripts/dev route --target "$TARGET" --base "$BASE" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unsupported target"; exit 1
          fi

  component-validation:
    name: component-validation
    needs: route
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout destination source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load validation toolchain pins
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/versions.env
          {
            echo "python=$PYTHON_VERSION"
            echo "uv=$UV_VERSION"
            echo "opa=$OPA_VERSION"
            echo "opa_sha256=$OPA_LINUX_AMD64_STATIC_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
          architecture: x64
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Install pinned OPA
        shell: bash
        env:
          OPA_VERSION: ${{ steps.versions.outputs.opa }}
          OPA_SHA256: ${{ steps.versions.outputs.opa_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          printf '%s  %s\n' "$OPA_SHA256" /tmp/opa | sha256sum --check --strict -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: Select repository development toolchain
        run: scripts/dev setup
      - name: Validate destination repository contract
        shell: bash
        run: scripts/dev gate repository
      - name: Validate tooling component
        shell: bash
        env:
          COMPLIANCE_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate tooling
      - name: Validate control-library component
        shell: bash
        env:
          COMPLIANCE_CONTROL_LIBRARY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate policy
      - name: Validate verification-policy component
        shell: bash
        env:
          COMPLIANCE_VERIFICATION_POLICY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate verification-policy
      - name: Validate ordinary development projects
        shell: bash
        env:
          COMPLIANCE_DEVELOPMENT_PROJECTS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate projects
      - name: Validate IAM private-source boundary
        shell: bash
        env:
          COMPLIANCE_IAM_PRIVATE_BOUNDARY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate iam

  verification-scenarios:
    name: verification-scenarios
    needs: route
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout destination source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load validation toolchain pins
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/versions.env
          {
            echo "python=$PYTHON_VERSION"
            echo "uv=$UV_VERSION"
            echo "opa=$OPA_VERSION"
            echo "opa_sha256=$OPA_LINUX_AMD64_STATIC_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
          architecture: x64
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Install pinned OPA
        shell: bash
        env:
          OPA_VERSION: ${{ steps.versions.outputs.opa }}
          OPA_SHA256: ${{ steps.versions.outputs.opa_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          printf '%s  %s\n' "$OPA_SHA256" /tmp/opa | sha256sum --check --strict -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version
      - name: Select repository development toolchain
        run: scripts/dev setup
      - name: Validate canonical verification scenarios
        shell: bash
        env:
          COMPLIANCE_VERIFICATION_SCENARIOS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate scenarios

  installed-release-provenance:
    name: installed-release-provenance
    needs: route
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout destination source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load validation toolchain pins
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/versions.env
          {
            echo "python=$PYTHON_VERSION"
            echo "uv=$UV_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
          architecture: x64
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Select repository development toolchain
        run: scripts/dev setup
      - name: Validate standalone installed package
        shell: bash
        run: scripts/dev gate package
      - name: Validate content-addressed locked artifacts
        shell: bash
        run: scripts/dev gate locked-artifacts
      - name: Validate annotated release tag gate
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          git -c user.name=release-validation \
              -c user.email=release-validation@example.invalid \
              tag -a v0.2.0-ci.1 -m "release validation" "$head_sha"
          resolved="$(bash tooling/scripts/validate-release-tag.sh v0.2.0-ci.1)"
          [[ "$resolved" == "$head_sha" ]]

          git tag v0.2.0-lightweight "$head_sha"
          if bash tooling/scripts/validate-release-tag.sh v0.2.0-lightweight; then
            echo "::error::lightweight release tag was accepted"
            exit 1
          fi

          git -c user.name=release-validation \
              -c user.email=release-validation@example.invalid \
              tag -a v0.2.0-other -m "wrong source" HEAD^
          if bash tooling/scripts/validate-release-tag.sh v0.2.0-other; then
            echo "::error::release tag pointing at a different commit was accepted"
            exit 1
          fi
      - name: Validate provider-neutral release preparation
        shell: bash
        env:
          COMPLIANCE_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev gate release-preparation
      - name: Validate local generic policy-source conformance
        shell: bash
        run: scripts/dev gate policy-release

  macos-portability:
    name: macos-portability
    needs: route
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up and inspect repository toolchain
        run: |
          /bin/bash scripts/dev setup
          /bin/bash scripts/dev doctor
      - name: Exercise working-tree and identity checks
        run: |
          /bin/bash scripts/dev check tooling test_canonical_json.py test_tooling_source.py test_package_schema_mirrors.py
          /bin/bash scripts/dev gate repository
      - name: Exercise portable package entrypoints
        env:
          COMPLIANCE_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          /bin/bash scripts/dev gate package
          /bin/bash scripts/dev gate release-preparation

  successor-experiment:
    name: successor-experiment
    needs: route
    if: ${{ needs.route.outputs.experiment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Execute disposable experiment
        run: bash successor/experiments/209-platform/check.sh core

  successor-package-linux:
    name: successor-package-linux
    needs: route
    if: ${{ needs.route.outputs.experiment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Execute disposable experiment
        run: bash successor/experiments/209-platform/check.sh package

  successor-package-macos:
    name: successor-package-macos
    needs: route
    if: ${{ needs.route.outputs.experiment == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Execute disposable experiment
        run: bash successor/experiments/209-platform/check.sh package

  successor-foundation:
    name: successor-foundation
    needs: [route, component-validation, verification-scenarios, installed-release-provenance, macos-portability, successor-experiment, successor-package-linux, successor-package-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every affected responsibility
        env:
          ROUTE: ${{ needs.route.result }}
          TARGET: ${{ needs.route.outputs.target }}
          LEGACY: ${{ needs.route.outputs.legacy }}
          EXPERIMENT: ${{ needs.route.outputs.experiment }}
          EXPERIMENT_CORE: ${{ needs.successor-experiment.result }}
          EXPERIMENT_LINUX: ${{ needs.successor-package-linux.result }}
          EXPERIMENT_MACOS: ${{ needs.successor-package-macos.result }}
          COMPONENT: ${{ needs.component-validation.result }}
          SCENARIOS: ${{ needs.verification-scenarios.result }}
          RELEASE: ${{ needs.installed-release-provenance.result }}
          MACOS: ${{ needs.macos-portability.result }}
        run: |
          set -euo pipefail
          [[ "$ROUTE" == success ]] || { echo "::error::scope/routing did not succeed"; exit 1; }
          case "$EXPERIMENT" in
            true) experiment_expected=success ;;
            false) experiment_expected=skipped ;;
            *) echo "::error::invalid experiment responsibility"; exit 1 ;;
          esac
          for result in "$EXPERIMENT_CORE" "$EXPERIMENT_LINUX" "$EXPERIMENT_MACOS"; do
            [[ "$result" == "$experiment_expected" ]] || { echo "::error::required experiment validation did not succeed"; exit 1; }
          done
          case "$TARGET:$LEGACY" in
            main:true|successor:true) expected=success ;;
            successor:false) expected=skipped ;;
            *) echo "::error::invalid lane responsibilities"; exit 1 ;;
          esac
          for result in "$COMPONENT" "$SCENARIOS" "$RELEASE" "$MACOS"; do
            [[ "$result" == "$expected" ]] || { echo "::error::affected legacy validation did not succeed"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test real bootstrap infrastructure
        run: scripts/dev foundation
