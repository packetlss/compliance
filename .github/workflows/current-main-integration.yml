name: Current-target integration

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to validate against its current base
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: current-target-integration-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve trusted PR head and current base
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head: ${{ steps.resolve.outputs.head }}
      base: ${{ steps.resolve.outputs.base }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve the open PR and current base
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::invalid PR number"; exit 1; }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(printf '%s' "$pr" | jq -r '.state')"
          head="$(printf '%s' "$pr" | jq -r '.head.sha')"
          base_ref="$(printf '%s' "$pr" | jq -r '.base.ref')"
          [[ "$state" == "open" ]] || { echo "::error::PR #$PR_NUMBER is not open"; exit 1; }
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid PR head"; exit 1; }
          case "$base_ref" in main|successor) ;; *) echo "::error::unsupported target"; exit 1 ;; esac
          [[ "$GITHUB_REF" == "refs/heads/$base_ref" ]] || { echo "::error::dispatch must use the actual trusted target"; exit 1; }
          base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base_ref" --jq '.object.sha')"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid base SHA"; exit 1; }
          [[ "$WORKFLOW_SHA" == "$base" ]] || { echo "::error::workflow source is stale; redispatch on current target"; exit 1; }
          {
            echo "pr_number=$PR_NUMBER"
            echo "head=$head"
            echo "base=$base"
            echo "target=$base_ref"
          } >> "$GITHUB_OUTPUT"
      - name: Publish pending integration status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.resolve.outputs.head }}
          BASE: ${{ steps.resolve.outputs.base }}
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
            -f state=pending \
            -f context="integration-current-$TARGET" \
            -f description="base=$BASE" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  route:
    name: integration routing
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      legacy: ${{ steps.route.outputs.legacy }}
      # Pre-Phase-A B has no experiment output and refuses every application path.
      experiment: ${{ steps.route.outputs.experiment || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit target and changed scope from trusted base
        id: route
        shell: bash
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
          BASE: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == main ]]; then
            printf 'legacy=true\nexperiment=false\n' >> "$GITHUB_OUTPUT"
          elif [[ "$TARGET" == successor ]]; then
            git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/routing/head"
            [[ "$(git rev-parse refs/remotes/routing/head)" == "$HEAD_SHA" ]]
            # Resolve duties with reviewed B code before any candidate merge.
            scripts/dev route --target "$TARGET" --base "$BASE" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unsupported target"; exit 1
          fi

  component-validation:
    name: integration component-validation
    needs: [resolve, route]
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Load validation toolchain pins
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/versions.env
          {
            echo "python=$PYTHON_VERSION"
            echo "uv=$UV_VERSION"
            echo "opa=$OPA_VERSION"
            echo "opa_sha256=$OPA_LINUX_AMD64_STATIC_SHA256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
          architecture: x64
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Install pinned OPA
        shell: bash
        env:
          OPA_VERSION: ${{ steps.versions.outputs.opa }}
          OPA_SHA256: ${{ steps.versions.outputs.opa_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          printf '%s  %s\n' "$OPA_SHA256" /tmp/opa | sha256sum --check --strict -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
      - run: scripts/dev setup
      - run: scripts/dev gate repository
      - run: scripts/dev gate tooling
        env:
          COMPLIANCE_TOOLING_SHA: ${{ steps.candidate.outputs.sha }}
      - run: scripts/dev gate policy
        env:
          COMPLIANCE_CONTROL_LIBRARY_SHA: ${{ steps.candidate.outputs.sha }}
      - run: scripts/dev gate verification-policy
        env:
          COMPLIANCE_VERIFICATION_POLICY_SHA: ${{ steps.candidate.outputs.sha }}
      - run: scripts/dev gate projects
        env:
          COMPLIANCE_DEVELOPMENT_PROJECTS_SHA: ${{ steps.candidate.outputs.sha }}
      - run: scripts/dev gate iam
        env:
          COMPLIANCE_IAM_PRIVATE_BOUNDARY_SHA: ${{ steps.candidate.outputs.sha }}

  verification-scenarios:
    name: integration verification-scenarios
    needs: [resolve, route]
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Load validation toolchain pins
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/versions.env
          {
            echo "python=$PYTHON_VERSION"
            echo "uv=$UV_VERSION"
            echo "opa=$OPA_VERSION"
            echo "opa_sha256=$OPA_LINUX_AMD64_STATIC_SHA256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
          architecture: x64
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Install pinned OPA
        shell: bash
        env:
          OPA_VERSION: ${{ steps.versions.outputs.opa }}
          OPA_SHA256: ${{ steps.versions.outputs.opa_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          printf '%s  %s\n' "$OPA_SHA256" /tmp/opa | sha256sum --check --strict -
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
      - run: scripts/dev setup
      - run: scripts/dev gate scenarios
        env:
          COMPLIANCE_VERIFICATION_SCENARIOS_SHA: ${{ steps.candidate.outputs.sha }}

  installed-release-provenance:
    name: integration installed-release-provenance
    needs: [resolve, route]
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Load validation toolchain pins
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source toolchain/versions.env
          {
            echo "python=$PYTHON_VERSION"
            echo "uv=$UV_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}
          architecture: x64
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.versions.outputs.uv }}
      - run: scripts/dev setup
      - run: scripts/dev gate package
      - run: scripts/dev gate locked-artifacts
      - name: Validate annotated release tag gate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git -c user.name=release-validation -c user.email=release-validation@example.invalid tag -a v0.2.0-ci.1 -m "release validation" "$candidate"
          [[ "$(bash tooling/scripts/validate-release-tag.sh v0.2.0-ci.1)" == "$candidate" ]]
          git tag v0.2.0-lightweight "$candidate"
          if bash tooling/scripts/validate-release-tag.sh v0.2.0-lightweight; then exit 1; fi
          git -c user.name=release-validation -c user.email=release-validation@example.invalid tag -a v0.2.0-other -m "wrong source" HEAD^
          if bash tooling/scripts/validate-release-tag.sh v0.2.0-other; then exit 1; fi
      - run: scripts/dev gate release-preparation
        env:
          COMPLIANCE_TOOLING_SHA: ${{ steps.candidate.outputs.sha }}
      - run: scripts/dev gate policy-release

  macos-portability:
    name: integration macos-portability
    needs: [resolve, route]
    if: ${{ needs.route.outputs.legacy == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up and inspect repository toolchain
        run: |
          /bin/bash scripts/dev setup
          /bin/bash scripts/dev doctor
      - name: Exercise working-tree and identity checks
        run: |
          /bin/bash scripts/dev check tooling test_canonical_json.py test_tooling_source.py test_package_schema_mirrors.py
          /bin/bash scripts/dev gate repository
      - name: Exercise portable package entrypoints
        env:
          COMPLIANCE_TOOLING_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          /bin/bash scripts/dev gate package
          /bin/bash scripts/dev gate release-preparation

  successor-experiment:
    name: integration successor-experiment
    needs: [resolve, route]
    if: ${{ needs.route.outputs.experiment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Execute disposable experiment
        run: bash successor/experiments/209-platform/check.sh core

  successor-package-linux:
    name: integration successor-package-linux
    needs: [resolve, route]
    if: ${{ needs.route.outputs.experiment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Execute disposable experiment
        run: bash successor/experiments/209-platform/check.sh package

  successor-package-macos:
    name: integration successor-package-macos
    needs: [resolve, route]
    if: ${{ needs.route.outputs.experiment == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Execute disposable experiment
        run: bash successor/experiments/209-platform/check.sh package

  successor-foundation:
    name: integration successor-foundation
    needs: [resolve, route]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build disposable combined candidate
        id: candidate
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/integration/head"
          [[ "$(git rev-parse refs/remotes/integration/head)" == "$HEAD" ]]
          git config user.name integration-validation
          git config user.email integration-validation@example.invalid
          git merge --no-ff --no-edit refs/remotes/integration/head
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test real bootstrap infrastructure
        run: scripts/dev foundation

  publish:
    name: Publish integration status
    needs:
      - resolve
      - route
      - successor-foundation
      - successor-experiment
      - successor-package-linux
      - successor-package-macos
      - component-validation
      - verification-scenarios
      - installed-release-provenance
      - macos-portability
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: Publish final status without checking out PR code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.resolve.outputs.head }}
          BASE: ${{ needs.resolve.outputs.base }}
          TARGET: ${{ needs.resolve.outputs.target }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          ROUTE: ${{ needs.route.result }}
          LEGACY: ${{ needs.route.outputs.legacy }}
          EXPERIMENT: ${{ needs.route.outputs.experiment }}
          EXPERIMENT_CORE: ${{ needs.successor-experiment.result }}
          EXPERIMENT_LINUX: ${{ needs.successor-package-linux.result }}
          EXPERIMENT_MACOS: ${{ needs.successor-package-macos.result }}
          FOUNDATION: ${{ needs.successor-foundation.result }}
          COMPONENT: ${{ needs.component-validation.result }}
          SCENARIOS: ${{ needs.verification-scenarios.result }}
          RELEASE: ${{ needs.installed-release-provenance.result }}
          MACOS: ${{ needs.macos-portability.result }}
        run: |
          set -euo pipefail
          state=failure
          expected=invalid
          case "$TARGET:$LEGACY" in
            main:true|successor:true) expected=success ;;
            successor:false) expected=skipped ;;
          esac
          if [[ "$ROUTE" == success && "$FOUNDATION" == success && "$expected" != invalid ]]; then
            state=success
            for result in "$COMPONENT" "$SCENARIOS" "$RELEASE" "$MACOS"; do
              [[ "$result" == "$expected" ]] || state=failure
            done
          fi
          case "$EXPERIMENT" in
            true) experiment_expected=success ;;
            false) experiment_expected=skipped ;;
            *) experiment_expected=invalid; state=failure ;;
          esac
          for result in "$EXPERIMENT_CORE" "$EXPERIMENT_LINUX" "$EXPERIMENT_MACOS"; do
            [[ "$result" == "$experiment_expected" ]] || state=failure
          done
          # Only trusted workflow text executes here; never check out proposed code.
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(printf '%s' "$pr" | jq -r '.state')" == open ]] || state=failure
          [[ "$(printf '%s' "$pr" | jq -r '.head.sha')" == "$HEAD" ]] || state=failure
          [[ "$(printf '%s' "$pr" | jq -r '.base.ref')" == "$TARGET" ]] || state=failure
          current_base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET" --jq '.object.sha')"
          [[ "$current_base" == "$BASE" ]] || state=failure
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
            -f state="$state" \
            -f context="integration-current-$TARGET" \
            -f description="base=$BASE" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
